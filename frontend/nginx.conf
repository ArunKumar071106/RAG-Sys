server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Allow the official site to embed the assistant (?embed=1) in an iframe.
    add_header Content-Security-Policy "frame-ancestors 'self' https://aaaenggcoll.ac.in https://www.aaaenggcoll.ac.in" always;

    # Same-origin API: js/config.js has apiBaseUrl "", so the page calls /api/* here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    # the page, scripts and styles are checked on every visit, so a new version shows at once
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://aaaenggcoll.ac.in https://www.aaaenggcoll.ac.in" always;
    }

    location /brand/ {
        expires 7d;
    }

    location / {
        try_files $uri /index.html;
    }
}
