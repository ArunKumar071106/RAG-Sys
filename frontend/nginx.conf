server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The visitor's address: from X-Forwarded-For when a proxy on a private network (Caddy for
    # HTTPS) sits in front, else the connection itself. Passed on, so rate limits are per visitor.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Allow the official site to embed the assistant (?embed=1) in an iframe.
    add_header Content-Security-Policy "frame-ancestors 'self' https://aaaenggcoll.ac.in https://www.aaaenggcoll.ac.in" always;

    # Same-origin API: the frontend is built with VITE_API_BASE_URL="" and calls /api/*.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
