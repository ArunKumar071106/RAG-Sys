# The college server: Qdrant (local, in its own container) + FastAPI backend + nginx serving the chat page
# and the admin panel. Everything stays on the server except the questions sent to Gemini.
#   cp .env.example .env   # GEMINI_API_KEY, ADMIN_TOKEN, REPORT_EMAIL_TO + SMTP_*, REFRESH_EVERY_DAYS=30
#   docker compose up -d --build
#   docker compose run --rm backend python -m rag.cli all     # crawl + index (first time, about an hour)
# Then open http://<server>:8080  (admin panel: http://<server>:8080/admin.html)
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    # not published: only the backend talks to Qdrant

  backend:
    build:
      context: ./backend
      args:
        WITH_ML: "false"  # FastEmbed search model: no PyTorch, a much smaller image. "true" adds BGE-M3 (EMBEDDING_PROVIDER=bge-m3)
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333     # the Qdrant container below: the vectors stay on this server
      QDRANT_API_KEY: ""
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      TZ: ${TZ:-Asia/Kolkata}            # REFRESH_HOUR=2 is 2 AM India time, REPORT_HOUR=18 is 6 PM
      CORS_ORIGINS: http://localhost:8080
      HF_HOME: /data/hf-cache
    volumes:
      - rag_data:/data
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
  rag_data:
