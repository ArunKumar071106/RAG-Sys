# Netlify builds and serves the frontend only; the backend runs elsewhere (e.g. a Hugging Face Space).
# Set VITE_API_BASE_URL in Netlify (Site configuration > Environment variables) to the backend's address,
# e.g. https://<hf-username>-arivazhai-api.hf.space, then redeploy.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # the chat may be embedded on the official website (?embed=1), nowhere else
    Content-Security-Policy = "frame-ancestors 'self' https://aaaenggcoll.ac.in https://www.aaaenggcoll.ac.in"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
