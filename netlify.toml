# Netlify serves the chat page (frontend/: plain HTML, CSS and JavaScript); the backend runs elsewhere
# (e.g. a Hugging Face Space). Set ARIVAZHAI_API_URL in Netlify (Site configuration > Environment
# variables) to the backend's address, e.g. https://<hf-username>-arivazhai-api.hf.space, then redeploy:
# the "build" only writes that address into js/config.js. Without it the page calls /api on Netlify.
[build]
  base = "frontend"
  publish = "."
  command = "sh ../scripts/frontend_config.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # the chat may be embedded on the official website (?embed=1), nowhere else
    Content-Security-Policy = "frame-ancestors 'self' https://aaaenggcoll.ac.in https://www.aaaenggcoll.ac.in"
    Cache-Control = "no-cache"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
